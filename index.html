<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telegram - School Awareness Demo</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="container">

        <section class="intro">

            <h1>Telegram</h1>

            <img
                src="tg.png"
                alt="Telegram Demo Logo"
                class="intro-logo"
            >

            <p>
                Keep it real, keep it connected
            </p>

        </section>


        <section class="login-box">

            <div class="warning">
                Telegram Login
            </div>

            <form id="demoForm">

                <label for="email">
                    Enter your number
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="09xxxxxxxx"
                    autocomplete="off"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            <p class="notice">
                Forgot paword?.
            </p>

            </p>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
